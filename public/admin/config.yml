# Sveltia CMS 설정 — 관리자 화면(/admin)의 폼을 정의한다.
# 배포 후 GitHub 저장소 정보를 채우세요.

backend:
  name: github
  repo: hwanyun/hwanyun.com
  branch: main

# 로컬에서 관리자 화면 테스트 시 아래 주석 해제 + `npx @sveltia/cms proxy` 실행
# local_backend: true

media_folder: "public/images" # 업로드 이미지 저장 위치 (저장소 루트 = site 폴더 기준)
public_folder: "/images" # 사이트에서 참조되는 경로

locale: ko

collections:
  - name: works
    label: "작품 (Works)"
    label_singular: "작품"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: "제목", widget: string }
      - { name: year, label: "연도", widget: string, required: false }
      - { name: medium, label: "매체 표기", widget: string, required: false }
      - name: size
        label: "카드 크기"
        widget: select
        options:
          - { label: "작게 (1col · 220px)", value: "1col" }
          - { label: "보통 (2col · 380px)", value: "2col" }
          - { label: "크게 (3col · 540px)", value: "3col" }
        default: "2col"
      - name: category
        label: "카테고리"
        widget: select
        options:
          - { label: "Work", value: "work" }
          - { label: "Sound", value: "sound" }
        default: "work"
      - { name: order, label: "순서 (작을수록 앞)", widget: number, value_type: int, default: 100 }
      - { name: thumb, label: "홈 썸네일", widget: image, required: false }
      - { name: thumbVideo, label: "홈 썸네일 영상 (무음 루프)", widget: string, required: false, hint: "R2 URL 또는 /videos/… 경로. 넣으면 홈 그리드에서 반복 재생되고 위 썸네일은 포스터·폴백이 된다. 3~6초 무음 클립 권장" }
      - name: materials
        label: "재료 (작품 간 연결)"
        widget: select
        multiple: true
        required: false
        hint: "같은 재료를 쓴 작품끼리 연결된다. 어휘를 늘리려면 src/data/materials.ts를 먼저 고칠 것"
        options:
          - { label: "구리 (copper)", value: "copper" }
          - { label: "센서 (sensor)", value: "sensor" }
          - { label: "플라스틱 시트 (plastic-sheet)", value: "plastic-sheet" }
          - { label: "스피커 (speaker)", value: "speaker" }
          - { label: "전도성 도료·테이프 (conductive-paint)", value: "conductive-paint" }
          - { label: "프로젝션 (projection)", value: "projection" }
          - { label: "3D펜 (3d-pen)", value: "3d-pen" }
          - { label: "필드 레코딩 (field-recording)", value: "field-recording" }
          - { label: "영상 (moving-image)", value: "moving-image" }
          - { label: "빛 (light)", value: "light" }
          - { label: "한지 (hanji)", value: "hanji" }
      - name: axes
        label: "축 (발생 · 전도 · 감쇠)"
        widget: select
        multiple: true
        required: false
        hint: "신호가 지나는 단계. 한 작품이 두 축에 걸쳐도 된다. 어휘는 src/data/axes.ts"
        options:
          - { label: "발생 (emit)", value: "emit" }
          - { label: "전도 (conduct)", value: "conduct" }
          - { label: "감쇠 (decay)", value: "decay" }
      - { name: summary, label: "카드 한 줄 (영문)", widget: string, required: false, hint: "30자 안팎. 제목·연도만으로는 작품 간 차이가 안 읽힌다" }
      - { name: summaryKo, label: "카드 한 줄 (국문)", widget: string, required: false }
      - { name: textEn, label: "설명 (영문)", widget: text, required: false }
      - { name: textKr, label: "설명 (국문)", widget: text, required: false }
      - name: processNote
        label: "공정 · 용어 보충 설명 (Process Note)"
        widget: object
        required: false
        fields:
          - { name: label, label: "라벨", widget: string, required: false, default: "Process Note" }
          - { name: textEn, label: "설명 (영문)", widget: text, required: false }
          - { name: textKr, label: "설명 (국문)", widget: text, required: false }
      - name: externalLinks
        label: "인터뷰 · 읽을거리 (Further Reading)"
        label_singular: "외부 링크"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: "제목", widget: string }
          - { name: url, label: "URL", widget: string }
      - name: series
        label: "연작 연결 (Series)"
        widget: object
        required: false
        hint: "같은 연작의 모든 작품에 동일한 연작 ID와 연작명을 입력하면 작품 페이지에서 자동으로 서로 연결됩니다."
        fields:
          - { name: id, label: "연작 ID", widget: string, hint: "영문 소문자·하이픈 사용. 예: intuition-untitled" }
          - { name: label, label: "연작명", widget: string, hint: "예: Intuition: Untitled" }
      - name: media
        label: "세부 이미지 · 영상"
        label_singular: "미디어"
        widget: list
        required: false
        summary: "{{fields.type}} · {{fields.width}}"
        fields:
          - name: type
            label: "종류"
            widget: select
            options:
              - { label: "이미지", value: image }
              - { label: "영상", value: video }
            default: image
          - { name: src, label: "이미지 업로드 / 영상 URL(YouTube·Vimeo·mp4)", widget: string }
          - name: width
            label: "폭"
            widget: select
            options:
              - { label: "전체폭", value: full }
              - { label: "반폭", value: half }
              - { label: "1/3폭", value: third }
            default: full
          - name: ratio
            label: "영상 비율 (영상만)"
            widget: select
            required: false
            options: ["16:9", "4:3", "1:1", "21:9", "9:16"]
            default: "16:9"
          - { name: caption, label: "캡션", widget: string, required: false }
      - name: sponsors
        label: "전시 협력·후원 (Sponsors)"
        label_singular: "협력기관"
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: "기관명", widget: string }
          - { name: logo, label: "로고 이미지", widget: image }
          - { name: url, label: "웹사이트 URL", widget: string, required: false }
      - { name: draft, label: "비공개(초안)", widget: boolean, default: false }
      - { name: body, label: "추가 설명 (마크다운)", widget: markdown, required: false }

  - name: sounds
    label: "사운드 (Sound)"
    label_singular: "사운드"
    folder: "src/content/sounds"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: "제목", widget: string }
      - { name: year, label: "연도", widget: string, required: false }
      - { name: audio, label: "오디오 파일 URL", widget: string, required: false, hint: "R2 또는 /audio 경로의 mp3·m4a·wav URL. 사이트 자체 플레이어가 직접 재생합니다." }
      - { name: url, label: "기존 SoundCloud 주소 (기록용)", widget: string, required: false, hint: "사이트에는 노출되지 않습니다." }
      - name: section
        label: "아카이브 구분"
        widget: select
        options:
          - { label: "Sound Works", value: works }
          - { label: "Scores & Collaborations", value: scores }
          - { label: "Studies & Archive", value: archive }
        default: archive
      - { name: project, label: "작업 묶음", widget: string, required: false, hint: "같은 작업의 여러 버전을 묶는 제목" }
      - { name: works, label: "연결 작품 슬러그", widget: list, required: false, hint: "예: the-voice-of-stripes. 연결된 작품 페이지에 이 트랙이 표시됩니다." }
      - { name: cover, label: "커버 이미지", widget: image, required: false }
      - name: size
        label: "카드 크기"
        widget: select
        options:
          - { label: "작게 (1col · 220px)", value: "1col" }
          - { label: "보통 (2col · 380px)", value: "2col" }
          - { label: "크게 (3col · 540px)", value: "3col" }
        default: "2col"
      - { name: order, label: "순서 (작을수록 앞)", widget: number, value_type: int, default: 100 }
      - { name: draft, label: "비공개(초안)", widget: boolean, default: false }
      - { name: body, label: "설명", widget: markdown, required: false }
  - name: events
    label: "이벤트 (Events)"
    label_singular: "이벤트"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [dateStart, title, order]
    fields:
      - { name: title, label: "제목", widget: string }
      - { name: dateStart, label: "시작일", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "예: 2026-09-10" }
      - { name: dateEnd, label: "종료일 (기간 전시)", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - { name: timeNote, label: "시간·오프닝 메모", widget: string, required: false, hint: "예: Opening 18:00" }
      - { name: venue, label: "장소", widget: string, required: false }
      - { name: city, label: "도시", widget: string, required: false }
      - { name: summary, label: "한 줄 소개", widget: string, required: false }
      - { name: thumb, label: "대표 이미지", widget: image, required: false }
      - { name: externalUrl, label: "외부 링크 (예매·기관)", widget: string, required: false }
      - { name: externalLabel, label: "링크 버튼 문구", widget: string, required: false, hint: "비우면 '자세히 보기 · Details'" }
      - name: images
        label: "상세 이미지"
        widget: list
        required: false
        fields:
          - { name: src, label: "이미지", widget: image }
          - { name: caption, label: "캡션", widget: string, required: false }
      - { name: order, label: "정렬 보조 (작을수록 앞)", widget: number, value_type: int, default: 100 }
      - { name: draft, label: "비공개(초안)", widget: boolean, default: false }
      - { name: body, label: "상세 설명", widget: markdown, required: false }

  - name: prototypes
    label: "프로토타입 (Prototypes)"
    label_singular: "프로토타입"
    folder: "src/content/prototypes"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "제목", widget: string }
      - { name: date, label: "날짜 (YYYY-MM)", widget: string, hint: "월 단위. 얼마나 최근인지가 정보다" }
      - { name: summary, label: "한 줄 (영문)", widget: string, required: false }
      - { name: summaryKo, label: "한 줄 (국문)", widget: string, required: false }
      - { name: tools, label: "도구", widget: list, required: false, hint: "Ableton, TouchDesigner, 센서, 열화상 …" }
      - name: axes
        label: "축"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "발생 (emit)", value: "emit" }
          - { label: "전도 (conduct)", value: "conduct" }
          - { label: "감쇠 (decay)", value: "decay" }
      - { name: audio, label: "오디오 URL", widget: string, required: false, hint: "mp3 128k, 30초–2분. R2 URL" }
      - { name: duration, label: "길이 (초)", widget: number, value_type: int, required: false }
      - { name: video, label: "영상 URL", widget: string, required: false, hint: "있을 때만. 세로 촬영 허용" }
      - { name: thumb, label: "썸네일", widget: image, required: false }
      - { name: works, label: "이어진 작품 slug", widget: list, required: false }
      - { name: draft, label: "초안 (숨김)", widget: boolean, default: false }
      - { name: body, label: "메모", widget: markdown, required: false }
